# Nginx site for Gurukrupa Eye Hospital (PWA + FastAPI).
# Install: sudo cp deploy/nginx-gurukrupa.conf /etc/nginx/sites-available/gurukrupa
#          sudo ln -sf /etc/nginx/sites-available/gurukrupa /etc/nginx/sites-enabled/gurukrupa
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL: do NOT hand-write ssl blocks here. After DNS points at the VPS run
#   sudo certbot --nginx -d clinic.example.com
# and certbot rewrites this file with the listen 443 / redirect blocks.

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME: the clinic's real domain (must match the certbot -d value).
    server_name clinic.example.com;

    access_log /var/log/nginx/gurukrupa.access.log;
    error_log  /var/log/nginx/gurukrupa.error.log;

    # Exam photos / machine printouts are uploaded as multipart; allow up to 25 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml font/woff2;

    # ---------- API: FastAPI via uvicorn on 127.0.0.1:8000 ----------
    # No trailing slash on proxy_pass so the /api prefix is passed through
    # unchanged (the app mounts every router under /api, health at /api/health).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # OCR of machine printouts (Tesseract) can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ---------- Protected uploads (exam photos, printouts) ----------
    # `internal` means a browser cannot request /uploads/... directly.
    # FastAPI does the auth check and then responds with an empty body plus
    # the header  X-Accel-Redirect: /uploads/<relative path under UPLOAD_DIR>
    # Nginx intercepts that response and streams the file from disk itself,
    # so Python never has to read/serve large images.
    location /uploads/ {
        internal;
        alias /srv/gurukrupa/uploads/;
        add_header Cache-Control "private, max-age=3600";
    }

    # ---------- PWA (built with `npm run build`) ----------
    root /srv/gurukrupa/frontend/dist;
    index index.html;

    # Service worker + manifest must never be cached, or clients get stuck on
    # an old build after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location ~* ^/(manifest\.webmanifest|manifest\.json|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Vite emits hashed filenames under /assets, safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: React Router owns /queue, /appointments, /ot, ...
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
