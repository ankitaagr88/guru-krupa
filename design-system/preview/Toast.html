<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Status" height=280 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
  <div class="toast" role="alert">
    <div class="t-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--alert)" stroke-width="2" style="width:15px;height:15px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      Dilation overdue
    </div>
    <div class="t-body">Sangita Rana (#007) — Cyclopentolate ran over by 4 minutes.</div>
    <button class="t-dismiss">Seen</button>
  </div>
  <div class="toast" role="alert">
    <div class="t-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--alert)" stroke-width="2" style="width:15px;height:15px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      Dilation overdue
    </div>
    <div class="t-body">Ilaben Chauhan (#005) — Cyclopentolate ran over by 11 minutes.</div>
    <button class="t-dismiss">Seen</button>
  </div>
</div>

</body>
</html>
