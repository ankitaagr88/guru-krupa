<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusPill — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Status" height=200 -->
<div class="gk-root" style="background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;">
  <div class="status-cell">
    <span class="status-pill">Waiting 6m</span>
    <span class="status-pill info">Records from elsewhere</span>
    <span class="status-pill gold">Dilating · drop 2</span>
    <span class="status-pill alert">Overdue 4m</span>
    <span class="status-pill done">Billed</span>
  </div>
  <div class="status-cell">
    <span class="status-pill gold"><span class="dot"></span>Tropicamide running</span>
    <span class="status-pill done"><span class="dot"></span>Refraction done</span>
    <span class="status-pill alert"><span class="dot"></span>Review overdue</span>
  </div>
  <p style="font-family:var(--font-ui);font-size:13px;color:var(--ink-soft);margin:0;">Every pill is labelled — the dot is reinforcement, never the signal.</p>
</div>

</body>
</html>
