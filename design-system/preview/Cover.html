<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard height=288 -->
<style>
  .gk-cover { position: relative; width: 960px; height: 288px; background: var(--canvas); overflow: hidden; }
  .gk-cover svg { position: absolute; inset: 0; display: block; }
  .gk-cover .c-gold  { fill: var(--gold); }
  .gk-cover .c-sapph { fill: var(--sapphire); }
  .gk-cover .c-wash  { fill: var(--gold-wash); }
  .gk-cover .c-deep  { fill: var(--sapphire-ink); }
  .gk-cover .r-lg    { rx: 14px; }
  .gk-cover .r-xl    { rx: 18px; }
  .gk-cover .arc     { fill: none; stroke-linecap: butt; }
  .gk-cover .a-1     { stroke: var(--gold-bright); }
  .gk-cover .a-2     { stroke: var(--sapphire-wash); }
  .gk-cover .a-3     { stroke: var(--done-wash); }
  .gk-cover .a-4     { stroke: var(--gold-wash); }
  .gk-cover .c-name {
    position: absolute; left: 56px; bottom: 50px;
    font-family: var(--font-serif); font-weight: 700; font-size: 72px; line-height: .95;
    letter-spacing: -.5px; color: var(--ink); max-width: 440px;
  }
  .gk-cover .c-tag {
    position: absolute; left: 56px; bottom: 24px;
    font-family: var(--font-ui); font-size: 14px; color: var(--ink-soft); max-width: 440px;
  }
</style>
<div class="gk-cover">
  <!--
    Derivation.
    Blocks: gold (256x94) + sapphire (160x98) + gold-wash (80x98) + a sapphire-ink
      slab (200x328) bleeding off the top, bottom and right edge. The monogram's two
      identity colours at full value, the deepest blue as the anchor, one wash for
      relief. ~38% of the cover.
    Arrangement: a staggered stack climbing left-to-right into the bleeding slab —
      the rise of the arrow in the GK mark, and the left-to-right six-stage journey
      the queue is built around. Never a row of equal squares.
    Pattern: the literal-motif row — concentric partial rings, which is the dilation
      countdown ring drawn at four radii and four remaining-fractions. Chosen because
      this is an eye hospital whose software is organised around a drop timer: the
      ring is the one piece of live UI in the product and the one shape only this
      brand has. A generic clinic system would not arrive at a countdown.
    Scales: arc radii stepped by 28px at 56/84/112/140; stroke 8px = space-2; block
      corners radius-lg (14px), the slab radius-xl (18px); text inset 56px.
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <rect class="c-deep r-xl"  x="784" y="-20" width="200" height="328"/>
    <rect class="c-gold r-lg"  x="500" y="170" width="256" height="94"/>
    <rect class="c-sapph r-lg" x="500" y="52"  width="160" height="98"/>
    <rect class="c-wash r-lg"  x="676" y="52"  width="80"  height="98"/>
    <g transform="rotate(-90 756 152)">
      <circle class="arc a-1" cx="756" cy="152" r="56"  stroke-width="8" stroke-dasharray="263.9 87.9"/>
      <circle class="arc a-2" cx="756" cy="152" r="84"  stroke-width="8" stroke-dasharray="263.9 263.9"/>
      <circle class="arc a-3" cx="756" cy="152" r="112" stroke-width="8" stroke-dasharray="211.1 492.6"/>
      <circle class="arc a-4" cx="756" cy="152" r="140" stroke-width="8" stroke-dasharray="131.9 747.7"/>
    </g>
  </svg>
  <div class="c-name">Gurukrupa<br>Care System</div>
  <div class="c-tag">Where is this patient, and what happens to them next.</div>
</div>

</body>
</html>
