<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Forms" height=210 -->
<div class="gk-root" style="background:var(--surface);padding:16px;max-width:380px;display:flex;flex-direction:column;gap:10px;">
  <div class="toggle-row">
    <span>Patient brought earlier records</span>
    <button class="switch on" role="switch" aria-checked="true" aria-label="Patient brought earlier records"><span class="knob"></span></button>
  </div>
  <textarea class="fake-input" id="swNote" rows="2" placeholder="Where were they treated, and when?">Cataract operation, Rajkot, 2018</textarea>
  <div class="toggle-row">
    <span>Send WhatsApp reminder</span>
    <button class="switch" role="switch" aria-checked="false" aria-label="Send WhatsApp reminder"><span class="knob"></span></button>
  </div>
</div>

</body>
</html>
