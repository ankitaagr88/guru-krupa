<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StageStrip — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Navigation" height=180 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;">
  <nav class="stage-strip" aria-label="Filter by stage">
    <button class="stage-pill active" aria-current="true">Registration <b>2</b></button>
    <button class="stage-pill">Pre-testing <b>2</b></button>
    <button class="stage-pill">With Doctor <b>1</b></button>
    <button class="stage-pill">Dilating · Wait <b>2</b></button>
    <button class="stage-pill">Billing <b>1</b></button>
    <button class="stage-pill finish">Done <b>1</b></button>
  </nav>
  <div style="height:14px;"></div>
  <nav class="stage-strip" aria-label="Filter by stage, Done selected">
    <button class="stage-pill">Registration <b>2</b></button>
    <button class="stage-pill">Pre-testing <b>2</b></button>
    <button class="stage-pill">With Doctor <b>1</b></button>
    <button class="stage-pill">Dilating · Wait <b>2</b></button>
    <button class="stage-pill">Billing <b>0</b></button>
    <button class="stage-pill finish active" aria-current="true">Done <b>1</b></button>
  </nav>
</div>

</body>
</html>
