<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConditionChip — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Forms" height=260 -->
<div class="gk-root" style="background:var(--surface);padding:16px;max-width:380px;">
  <div class="field-label">Existing medical conditions</div>
  <div class="condition-grid">
    <label class="condition-item checked"><input type="checkbox" checked><span>Diabetes</span></label>
    <label class="condition-item checked"><input type="checkbox" checked><span>Hypertension</span></label>
    <label class="condition-item"><input type="checkbox"><span>Asthma</span></label>
    <label class="condition-item"><input type="checkbox"><span>Arthritis</span></label>
    <label class="condition-item"><input type="checkbox"><span>Thyroid disorder</span></label>
    <label class="condition-item"><input type="checkbox"><span>Allergy</span></label>
  </div>
  <input class="fake-input" id="condOther" placeholder="Other condition (if any)" style="margin-top:6px;">
</div>

</body>
</html>
