<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrescriptionSheet — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Surfaces" height=400 -->
<div class="gk-root" style="background:var(--canvas);padding:20px;display:flex;justify-content:center;">
  <div class="rx-sheet">
    <div class="rx-head">
      <h3>Gurukrupa Eye Hospital</h3>
      <p>Ghod Dod Road, Surat · Dr. Anu Juneja Pathak</p>
    </div>
    <div class="rx-patient"><span>Bharat Oza · 71M</span><span class="d">12 Sep 2026</span></div>
    <div class="rx-list">
      <div class="rx-item">
        <div class="rx-name">Timolol 0.5% eye drops</div>
        <div class="rx-dose">1 drop both eyes, twice daily</div>
      </div>
      <div class="rx-item">
        <div class="rx-name">Latanoprost 0.005% eye drops</div>
        <div class="rx-dose">1 drop both eyes, at night</div>
      </div>
      <div class="rx-item" style="border-bottom:none;">
        <div class="rx-name">Carboxymethylcellulose 0.5%</div>
        <div class="rx-dose">1 drop both eyes, four times daily, for 2 weeks</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
