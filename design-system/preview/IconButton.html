<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Actions" height=140 -->
<div class="gk-root" style="background:var(--surface);padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
  <button class="icon-btn" aria-label="Search patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  <button class="icon-btn" aria-label="Print prescription"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="8" y="14" width="8" height="7"/></svg></button>
  <button class="icon-btn" aria-label="Filter queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
  <button class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <span style="font-family:var(--font-ui);font-size:13px;color:var(--ink-soft);margin-left:6px;">Every one carries an aria-label</span>
</div>

</body>
</html>
