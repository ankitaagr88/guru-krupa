<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopBar — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Navigation" height=300 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;display:flex;flex-direction:column;gap:18px;">
  <div>
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Desktop</div>
    <div class="topbar" style="border-radius:12px;border:1px solid var(--line);">
      <div class="topbar-lead">
        <div>
          <h1>Gurukrupa Eye Hospital &amp; Research Center</h1>
          <div class="sub">Dr. Anu Juneja Pathak · Reception desk · Today's queue</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" aria-label="Search patients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <div class="clock">Saturday, 12 Sep<b>11:42</b></div>
        <button class="btn-primary">+ New patient</button>
      </div>
    </div>
  </div>
  <div style="max-width:380px;">
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Phone, 380px</div>
    <div class="topbar" style="border-radius:12px;border:1px solid var(--line);padding:14px 16px;">
      <div class="topbar-lead">
        <button class="nav-trigger" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <h1 style="font-size:17px;line-height:20px;">Gurukrupa Eye Hospital</h1>
          <div class="sub" style="font-size:12px;">Reception · Today's queue</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" aria-label="Search patients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="btn-primary sm">+ New</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
