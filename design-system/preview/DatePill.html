<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DatePill — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Queue" height=140 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;">
  <div class="date-strip" role="group" aria-label="Pick a date">
    <button class="date-pill"><div class="dow">THU</div><div class="dnum">10</div></button>
    <button class="date-pill"><div class="dow">FRI</div><div class="dnum">11</div></button>
    <button class="date-pill active" aria-current="date"><div class="dow">SAT</div><div class="dnum">12</div></button>
    <button class="date-pill"><div class="dow">SUN</div><div class="dnum">13</div></button>
    <button class="date-pill"><div class="dow">MON</div><div class="dnum">14</div></button>
    <button class="date-pill"><div class="dow">TUE</div><div class="dnum">15</div></button>
    <button class="date-pill"><div class="dow">WED</div><div class="dnum">16</div></button>
  </div>
</div>

</body>
</html>
