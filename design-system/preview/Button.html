<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Actions" height=200 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;display:flex;flex-direction:column;gap:16px;">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <button class="btn-primary">+ New patient</button>
    <button class="btn-primary sm">Check in</button>
    <button class="btn-ghost" style="flex:0 0 auto;padding-inline:18px;">Cancel</button>
  </div>
  <div>
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-bottom:8px;">In a modal footer</div>
    <div class="modal-actions" style="max-width:340px;">
      <button class="btn-ghost">Cancel</button>
      <button class="btn-primary full">Add to queue</button>
    </div>
  </div>
</div>

</body>
</html>
