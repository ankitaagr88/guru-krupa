<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextField — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Forms" height=300 -->
<div class="gk-root" style="background:var(--surface);padding:16px;max-width:360px;">
  <div class="field-label">Patient details</div>
  <input class="fake-input" id="tfName" placeholder="Full name" value="Rasilaben Patel" style="margin-bottom:8px;">
  <input class="fake-input" id="tfPhone" placeholder="Phone number" value="98250 12345" style="margin-bottom:8px;">
  <div class="detail-grid">
    <input class="fake-input" id="tfAge" placeholder="Age" value="62">
    <input class="fake-input" id="tfOcc" placeholder="Occupation">
  </div>
  <div class="field-label">Doctor's notes</div>
  <textarea class="fake-input" id="tfNotes" rows="3" placeholder="Findings, advice, follow-up">Early cataract, right eye. Review in 6 weeks.</textarea>
</div>

</body>
</html>
