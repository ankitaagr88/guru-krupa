<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BottomTabBar — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Navigation" height=220 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;">
  <div style="max-width:380px;margin:0 auto;">
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Phone, 380px</div>
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;">
      <div style="padding:18px 16px;font-family:var(--font-ui);font-size:14px;color:var(--ink-faint);">Queue content scrolls here</div>
      <nav class="bottomnav gk-on-navy" aria-label="Main">
        <button class="bottomnav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
          <span>Queue</span><span class="bottomnav-badge">9</span>
        </button>
        <button class="bottomnav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span>Appts</span><span class="bottomnav-badge">6</span>
        </button>
        <button class="bottomnav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/><path d="M9 3l1.5 2M15 3l-1.5 2"/></svg>
          <span>OT</span>
        </button>
        <button class="bottomnav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
          <span>More</span>
        </button>
      </nav>
    </div>
  </div>
</div>

</body>
</html>
