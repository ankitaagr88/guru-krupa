<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DilationStep — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Clinical" height=330 -->
<div class="gk-root" style="background:var(--surface);padding:16px;max-width:380px;display:flex;flex-direction:column;gap:7px;">
  <div class="dstep done">
    <span class="dstep-check">✓</span>
    <div class="dstep-name">Tropicamide 0.8%<small>Given 11:26 AM</small></div>
    <span class="dstep-tag">5 min</span>
  </div>
  <div class="dstep active">
    <input type="checkbox" aria-label="Mark Cyclopentolate 1% as given">
    <div class="dstep-name">Cyclopentolate 1%<small>Started 11:31 AM</small></div>
    <span class="dstep-tag timer">9m left</span>
  </div>
  <div class="dstep pending">
    <span class="dstep-check">○</span>
    <div class="dstep-name">Phenylephrine 5%<small>Not started</small></div>
    <span class="dstep-tag next">10 min</span>
  </div>
  <div style="height:6px;"></div>
  <div class="dstep-complete">Dilation complete — ready for the doctor</div>
</div>

</body>
</html>
