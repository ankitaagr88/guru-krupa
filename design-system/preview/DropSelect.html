<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropSelect — Gurukrupa Care System</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--canvas);}</style>
</head>
<body>
<!-- @dsCard group="Forms" height=210 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;max-width:380px;">
  <div class="field-label">How did they hear about us?</div>
  <select class="drop-select" id="dsRef" aria-label="How did they hear about us?">
    <option>Self / Walk-in</option>
    <option selected>Referred by another doctor</option>
    <option>Referred by family / another patient</option>
    <option>Online / Google</option>
    <option>BNI</option>
    <option>Insurance / TPA</option>
    <option>Camp / Outreach</option>
  </select>
  <input class="fake-input" id="dsDetail" placeholder="Referred by — name" value="Dr. Shah" style="margin-top:8px;">
</div>

</body>
</html>
