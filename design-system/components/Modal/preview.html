<!-- @dsCard group="Surfaces" height=380 -->
<div class="gk-root" style="background:var(--canvas);padding:20px;display:flex;justify-content:center;">
  <div class="modal" role="dialog" aria-label="New patient">
    <h2>New patient</h2>
    <p class="sub">They will join the queue at Registration with the next token.</p>
    <input class="fake-input" id="mdl1" placeholder="Full name" style="margin-bottom:10px;">
    <input class="fake-input" id="mdl2" placeholder="Phone number" style="margin-bottom:10px;">
    <div class="detail-grid">
      <input class="fake-input" id="mdl3" placeholder="Age">
      <div class="seg-toggle" role="group" aria-label="Sex">
        <button type="button" aria-pressed="false">F</button>
        <button type="button" aria-pressed="false">M</button>
        <button type="button" aria-pressed="false">Other</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost">Cancel</button>
      <button class="btn-primary full">Add to queue</button>
    </div>
  </div>
</div>
