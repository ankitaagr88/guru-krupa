<!-- @dsCard group="Clinical" height=270 -->
<div class="gk-root" style="background:var(--surface);padding:16px;max-width:380px;display:flex;flex-direction:column;gap:7px;">
  <div class="med-row">
    <div class="med-main">
      <div class="med-name">Timolol 0.5% eye drops <span class="match-tag">Matched</span></div>
      <input class="dosage-input" id="md1" value="1 drop both eyes, twice daily">
    </div>
    <button class="rm" aria-label="Remove Timolol">✕</button>
  </div>
  <div class="med-row manual">
    <div class="med-main">
      <div class="med-name">Latanoprost 0.005% eye drops</div>
      <input class="dosage-input" id="md2" value="1 drop both eyes, at night">
    </div>
    <button class="rm" aria-label="Remove Latanoprost">✕</button>
  </div>
  <div style="display:flex;gap:7px;margin-top:2px;">
    <input class="fake-input" id="mdAdd" placeholder="Search or type a medicine" style="flex:1;">
    <button class="btn-primary sm">Add</button>
  </div>
</div>
