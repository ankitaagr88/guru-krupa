<!-- @dsCard group="Status" height=180 -->
<div class="gk-root" style="background:var(--surface);padding:16px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;">
  <div style="text-align:center;">
    <div class="timer-ring">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="bg" cx="23" cy="23" r="19" fill="none" stroke-width="4"/>
        <circle class="fg" cx="23" cy="23" r="19" fill="none" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="41.8"/>
      </svg>
      <div class="txt">9m</div>
    </div>
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-top:8px;">Running</div>
  </div>
  <div style="text-align:center;">
    <div class="timer-ring">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="bg" cx="23" cy="23" r="19" fill="none" stroke-width="4"/>
        <circle class="fg" cx="23" cy="23" r="19" fill="none" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="107"/>
      </svg>
      <div class="txt">1m</div>
    </div>
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);margin-top:8px;">Nearly done</div>
  </div>
  <div style="text-align:center;">
    <div class="timer-ring overdue">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="bg" cx="23" cy="23" r="19" fill="none" stroke-width="4"/>
        <circle class="fg" cx="23" cy="23" r="19" fill="none" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="0"/>
      </svg>
      <div class="txt">+4</div>
    </div>
    <div style="font-family:var(--font-ui);font-size:12px;color:var(--alert-ink);margin-top:8px;">Overdue</div>
  </div>
</div>
