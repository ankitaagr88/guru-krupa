<!-- @dsCard group="Surfaces" height=250 -->
<div class="gk-root" style="background:var(--canvas);padding:16px;display:flex;gap:12px;flex-wrap:wrap;">
  <div class="card" style="width:210px;">
    <div style="font-family:var(--font-ui);font-weight:700;font-size:17px;">At rest</div>
    <div style="font-family:var(--font-ui);font-size:14px;color:var(--ink-soft);margin-top:6px;">line border, shadow-rest</div>
  </div>
  <div class="card interactive" style="width:210px;border-color:var(--sapphire);box-shadow:var(--shadow-md);">
    <div style="font-family:var(--font-ui);font-weight:700;font-size:17px;">Hovered</div>
    <div style="font-family:var(--font-ui);font-size:14px;color:var(--ink-soft);margin-top:6px;">teal border, shadow-hover</div>
  </div>
  <div class="card selected" style="width:210px;">
    <div style="font-family:var(--font-ui);font-weight:700;font-size:17px;">Selected</div>
    <div style="font-family:var(--font-ui);font-size:14px;color:var(--ink-soft);margin-top:6px;">teal border, teal-wash ring</div>
  </div>
</div>
